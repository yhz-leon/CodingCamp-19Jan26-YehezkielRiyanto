<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <Header>
        <h1 class="text 2xl font-bold" align="center">Todo List</h1>
        <p>Menu Latihan Training Camp</p>
    </Header>

    <main>
        <form id="todoForm">
            <input type="text" id="taskInput" placeholder="Silahkan tulis nama">
            <input type="date" id="dateInput">
            <button type="submit">Add</button>
        </form>

        <div class="filter">
            <label for="filterStatus">Filter</label>
            <select id="filterStatus">
                <option value="all">All</option>
                <option value="active">Active</option>
            </select>
        </div>
    <ul id="todoList"></ul>
    </main>
    
  <small>© 2026 Mini Project REVOU</small>
    
</footer>
<script src="script.js"></script>
</footer>
    
</body>
</html>
